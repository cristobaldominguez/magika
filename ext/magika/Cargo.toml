[package]
name = "magika"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
magika-rust = { package = "magika", version = "1.0" }
magnus = { version = "0.7", features = ["rb-sys", "old-api"] }
once_cell = "1.20"
# Magika disables ort default features, so the Ruby native extension must
# opt into ONNX Runtime binary download/copying for local and CI builds.
ort = { version = "=2.0.0-rc.11", features = ["download-binaries", "tls-native", "copy-dylibs"] }
